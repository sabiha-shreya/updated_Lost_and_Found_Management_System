<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Campus Lost & Found</title>

    <!-- Common CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <h1>Login</h1>

        <div id="login-error" style="display:none; color: #b91c1c; background-color: #fef2f2; border: 1px solid #f87171; border-radius: 6px; padding: 10px; margin-bottom: 15px; font-size: 14px; font-weight: 500; text-align: center;"></div>

        <form action="login.php" method="POST" autocomplete="on">

            <input
                type="text"
                name="email"
                placeholder="Student ID or Email"
                autocomplete="username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p>Don't have an account?</p>

        <a href="register.html">
            Register
        </a>

    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const err = params.get('error');
        if (err) {
            const el = document.getElementById('login-error');
            if (el) {
                el.textContent = err;
                el.style.display = 'block';
            }
        }
    </script>
</body>

</html>
